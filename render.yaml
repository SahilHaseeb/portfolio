# render.yaml — Render deployment configuration
# Static site — no build step needed (pure HTML/CSS/JS)

services:
  - type: web
    name: portfolio
    env: static
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /src/styles/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /src/js/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /public/assets/*
        name: Cache-Control
        value: public, max-age=604800, immutable
